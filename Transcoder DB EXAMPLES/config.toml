initialized = true

[paths]
watch_folder = 'C:\Users\toutountzaki\Desktop\Ingest'
target_folder = 'C:\Users\toutountzaki\Desktop\casparcg-server-v2.5.0-stable-windows\media'

[server]
web_port = 4353
bind_address = "127.0.0.1"

[encoding]
preset = "medium"
ffmpeg_threads = 8
cpu_cores = 0
audio_codec = "aac"
audio_bitrate = "320k"
tune = "film"
probesize = "500M"
analyzeduration = "500M"

[profile_a]
enabled = true
crf = 24
maxrate = "15M"
bufsize = "16M"

[profile_b]
enabled = true
crf = 23
maxrate = "15M"
bufsize = "16M"

[profile_c]
enabled = true
crf = 20
maxrate = "5M"
bufsize = "6M"

[ingestion]
settle_secs = 5
poll_secs = 10
max_concurrency = 1
stable_polls_min = 2
retry_policy = "once"
auto_retry_on_start = true
max_attempts = 2
retry_delay_ms = 2000
clean_source_after_success = false
include_extensions = []
exclude_extensions = []

[logging]
level = "info"
log_file = "transcode.log"
