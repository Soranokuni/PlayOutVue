name: CI

# Audit T1-13: every quality gate in AGENTS.md was manual. This workflow runs
# the verify-build pipeline on every push and pull request so a regression in
# the playout state machine can never reach main unnoticed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (type-check, tests, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # advisory.html is build output from templates-src/advisory/; fail loudly
      # if a committed copy was hand-edited instead of rebuilt.
      - run: node scripts/build-advisory.mjs --check
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --run
      - run: npm run build-only

  backend:
    name: Backend (clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The Tauri build script embeds ../dist; provide an empty one so
      # `cargo clippy`/`cargo test` do not require a frontend build here.
      - run: New-Item -ItemType Directory -Force dist | Out-Null; if (-not (Test-Path dist/index.html)) { Set-Content dist/index.html '<!doctype html>' }
        shell: pwsh
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reports known vulnerabilities. Blocking since the T2-17 clean-up brought
    # the npm baseline (prod and dev trees) to zero advisories.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
