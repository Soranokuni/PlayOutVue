[package]
name = "playout_app"
version = "3.0.0"
description = "Aether Broadcast Master Control Playout"
authors = ["Soranokuni <shadowsora13@hotmail.gr>"]
repository = "https://github.com/Soranokuni/PlayOutVue"
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "playout_app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
regex = "1.12"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# Audit T2-18: only the runtime pieces this crate uses (was "full").
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
rosc = "0.11.4"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
parking_lot = "0.12"
dirs-next = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

# src-tauri/Cargo.toml

[profile.release]
# Audit T1-6: this is an on-air master-control process. `panic = "abort"`
# turned any panic into an instant, silent process exit with no report and no
# chance to flush logs. Unwinding costs nothing measurable for this workload
# and lets the panic hook (lib.rs) write a crash report first.
panic = "unwind"
codegen-units = 1 # Compile everything together for maximum optimization
lto = true # Link Time Optimization (removes dead code)
opt-level = 3 # Optimize for runtime speed (real-time playout)
# Keep line tables so panic backtraces are symbolisable. On MSVC the debug info
# lives in the separate .pdb, so the executable itself stays small; archive the
# .pdb next to each release so crash reports can be resolved later.
debug = "line-tables-only"
strip = "none"
