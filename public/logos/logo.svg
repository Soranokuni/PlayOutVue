<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Broadcast-safe Neumorphic Dual-Shadow Filter (-135 deg light source) -->
    <filter id="sitia-neumorphic-depth" x="-40%" y="-40%" width="180%" height="180%">
      <!-- Dark ambient drop shadow (+5px, +7px, stdDev 6) -->
      <feDropShadow dx="5" dy="7" stdDeviation="6" flood-color="#18031d" flood-opacity="0.85" />
      <!-- Specular light highlight (-3.5px, -3.5px, stdDev 4.5, Rec. 709 safe #f0f5fc) -->
      <feDropShadow dx="-3.5" dy="-3.5" stdDeviation="4.5" flood-color="#f0f5fc" flood-opacity="0.5" />
    </filter>

    <!-- Convex Surface Gradient (135 deg: #8a2c94 -> #702177 -> #46104c) -->
    <linearGradient id="sitia-convex-surface" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#8a2c94" />
      <stop offset="42%" stop-color="#702177" />
      <stop offset="100%" stop-color="#46104c" />
    </linearGradient>

    <!-- 1px High-Contrast Micro-Border Gradient (135 deg) -->
    <linearGradient id="sitia-micro-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.7)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.3)" />
      <stop offset="100%" stop-color="rgba(40, 5, 45, 0.5)" />
    </linearGradient>

    <!-- 3D Extruded Text Face Gradient -->
    <linearGradient id="sitia-text-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f7edf9" />
      <stop offset="100%" stop-color="#e6d2e9" />
    </linearGradient>

    <!-- Subtle Text Drop Shadow Filter -->
    <filter id="sitia-text-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2.2" stdDeviation="0.8" flood-color="#1f0224" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Squircle with Dual Neumorphic Shadows -->
  <g filter="url(#sitia-neumorphic-depth)">
    <!-- Main Tactile Squircle Body (rx="52" ry="52" on 180x180 is ~28.8% continuous G2 curvature) -->
    <rect
      x="10"
      y="10"
      width="180"
      height="180"
      rx="52"
      ry="52"
      fill="url(#sitia-convex-surface)"
      stroke="url(#sitia-micro-border)"
      stroke-width="1.6"
    />
  </g>

